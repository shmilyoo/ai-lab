name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 生成资产索引
        run: node scripts/build-catalog.mjs
      - name: 生成市场 registry
        run: node dsh/plugin-market/scripts/build-registry.mjs
      - name: 校验一致性
        run: node dsh/plugin-market/scripts/validate.mjs
