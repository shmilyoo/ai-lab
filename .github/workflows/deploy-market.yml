name: deploy-market

on:
  push:
    branches: [main]
    paths:
      - "dsh/plugins/**"
      - "dsh/plugin-market/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 生成并校验 registry
        run: |
          node dsh/plugin-market/scripts/build-index.mjs
          node dsh/plugin-market/scripts/validate.mjs
      - name: 组装站点
        run: node dsh/plugin-market/scripts/build-site.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dsh/plugin-market/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
