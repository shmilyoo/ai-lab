<!doctype html>
<!-- 文件职责：市场静态页，读取同目录的 plugins.json 并渲染插件列表。
     关系：plugins.json 由 CI 从 ../registry/plugins.json 复制而来，因此本页不关心仓库结构。
     约定：不引入构建工具与外部依赖，保证 GitHub Pages 直接可用；
     数据加载失败时展示可直接照做的排查提示，而不是空白页。 -->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ai-lab · DSH 插件市场</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f1115;
        --panel: #171a21;
        --border: #2a2f3a;
        --text: #e6e9ef;
        --muted: #9aa4b2;
        --accent: #6ea8fe;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(1200px 600px at 20% -10%, #1b2333, var(--bg));
        color: var(--text);
        font: 15px/1.6 system-ui, -apple-system, "Segoe UI", "PingFang SC", sans-serif;
      }
      main { max-width: 880px; margin: 0 auto; padding: 48px 24px 80px; }
      header h1 { margin: 0 0 8px; font-size: 26px; letter-spacing: 0.3px; }
      header p { margin: 0; color: var(--muted); }
      .empty {
        margin-top: 32px;
        padding: 24px;
        border: 1px dashed var(--border);
        border-radius: 12px;
        color: var(--muted);
      }
      .card {
        margin-top: 16px;
        padding: 20px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 14px;
        display: grid;
        grid-template-columns: 48px 1fr;
        gap: 16px;
      }
      .card img { width: 48px; height: 48px; border-radius: 10px; background: #0b0d12; object-fit: contain; }
      .card h2 { margin: 0; font-size: 17px; }
      .card h2 span { color: var(--muted); font-size: 13px; font-weight: 400; margin-left: 8px; }
      .card p { margin: 6px 0 12px; color: var(--muted); }
      .card code {
        display: inline-block;
        padding: 6px 10px;
        background: #0b0d12;
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--accent);
        font-size: 13px;
      }
      .card a { color: var(--muted); font-size: 13px; margin-left: 12px; }
      @media (prefers-color-scheme: light) {
        :root { --bg: #f6f7fb; --panel: #ffffff; --border: #e2e5ec; --text: #1a1d24; --muted: #5b6472; }
        body { background: radial-gradient(1200px 600px at 20% -10%, #e8eefc, var(--bg)); }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>ai-lab · DSH 插件市场</h1>
        <p>个人 DeepSeek Harness 插件。数据来自仓库内 <code>dsh/plugins</code>，由 CI 生成，不手写。</p>
      </header>
      <section id="list" aria-live="polite">
        <div class="empty">正在加载 plugins.json…</div>
      </section>
    </main>

    <script>
      const CATEGORY_LABEL = {
        ui: "界面",
        tool: "工具",
        workflow: "工作流",
        integration: "集成",
        theme: "主题",
        other: "其他",
      };

      function el(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text) node.textContent = text;
        return node;
      }

      function renderCard(plugin) {
        const card = el("article", "card");
        const icon = el("img");
        icon.src = plugin.icon;
        icon.alt = "";
        icon.loading = "lazy";
        icon.addEventListener("error", () => { icon.style.visibility = "hidden"; });

        const body = el("div");
        const title = el("h2", null, plugin.name);
        title.appendChild(el("span", null, `v${plugin.version} · ${CATEGORY_LABEL[plugin.category] || plugin.category}`));
        body.appendChild(title);
        body.appendChild(el("p", null, plugin.description.zh || plugin.description.en || ""));

        const install = el("code", null, plugin.install);
        body.appendChild(install);

        const link = el("a", null, "源码");
        link.href = plugin.url;
        link.rel = "noopener";
        body.appendChild(link);

        card.append(icon, body);
        return card;
      }

      async function load() {
        const list = document.getElementById("list");
        let data;
        try {
          const response = await fetch("./plugins.json", { cache: "no-store" });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          data = await response.json();
        } catch (error) {
          list.replaceChildren(
            el("div", "empty", `读取 plugins.json 失败：${error.message}。请确认站点目录里有 plugins.json，并通过 HTTP 打开页面（直接双击 file:// 会被浏览器拦截）。`)
          );
          return;
        }

        if (!data.plugins || data.plugins.length === 0) {
          list.replaceChildren(el("div", "empty", "市场里还没有插件。在 dsh/plugins/ 下新增插件包后，重新生成 registry 并部署。"));
          return;
        }
        list.replaceChildren(...data.plugins.map(renderCard));
      }

      load();
    </script>
  </body>
</html>
